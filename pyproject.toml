[project]
name = "bicycle-theft-prediction"
version = "0.1.0"
description = "Predict Bicycle Thefts in Fukuoka"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "polars>=2.0.0",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "ipykernel>=7.4.0",
    "dlt>=1.31.0",
    "pyarrow>=26.0.0",
    "pmtiles>=3.8.1",
]

[dependency-groups]
dev = [
    "ipython>=9.17.1",
]
