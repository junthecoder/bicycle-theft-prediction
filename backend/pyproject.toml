[project]
name = "bicycle-theft-prediction"
version = "0.1.0"
description = "Predict Bicycle Thefts in Fukuoka"
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "polars>=2.0.0",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "dlt>=1.31.0",
    "pyarrow>=26.0.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[project.scripts]
pipeline = "bicycle_theft.pipeline:main"
census-bbox = "bicycle_theft.census_bbox:main"
download-pmtiles = "bicycle_theft.download_pmtiles:main"
build-areas = "bicycle_theft.areas:main"
api = "bicycle_theft.api.app:main"
export-openapi = "bicycle_theft.api.export_openapi:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bicycle_theft"
